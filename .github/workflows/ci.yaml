name: CFFI CI

on:
  push:
  pull_request:
    types: [ opened, synchronize, reopened ]
  schedule:
  - cron: '0 12 * * 1'
  workflow_dispatch:
    inputs:
      skip_artifact_upload:
        description: Skip (most) job artifact uploads?
        type: boolean
        default: true
      skip_ci_redundant_jobs:
        description: Skip CI redundant jobs?
        type: boolean
        default: true
      skip_slow_jobs:
        description: Skip slow/emulated jobs?
        type: boolean
        default: true

env:
  skip_ci_redundant_jobs: ${{ (github.event_name == 'workflow_dispatch' && inputs.skip_ci_redundant_jobs) || (github.event_name == 'pull_request' || github.event_name == 'push') }}
  skip_slow_jobs: ${{ (github.event_name == 'workflow_dispatch' && inputs.skip_slow_jobs) || (github.event_name == 'pull_request' || github.event_name == 'push') }}
  skip_artifact_upload: ${{ (github.event_name == 'workflow_dispatch' && inputs.skip_artifact_upload) || github.event_name != 'workflow_dispatch' }}

jobs:
  python_sdist:
    runs-on: ubuntu-24.04
    outputs:
      sdist_artifact_name: ${{ steps.build_sdist.outputs.sdist_artifact_name }}
      package_version: ${{ steps.build_sdist.outputs.package_version }}
    steps:
    - name: clone repo
      uses: actions/checkout@v7

    - name: install python
      uses: actions/setup-python@v6
      with:
        python-version: 3.x

    - name: build sdist
      id: build_sdist
      run: |
        rm -rf dist/
        python -m pip install build
        python -m build --sdist
        
        echo "sdist_artifact_name=$(ls ./dist)" >> "$GITHUB_OUTPUT"
        echo "package_version=$(ls ./dist | sed -En 's/cffi-(.+)\.tar\.gz/\1/p')" >> "$GITHUB_OUTPUT"

    - name: upload sdist artifact
      uses: actions/upload-artifact@v7
      with:
        name: ${{ steps.build_sdist.outputs.sdist_artifact_name }}
        path: dist/${{ steps.build_sdist.outputs.sdist_artifact_name }}
        if-no-files-found: error
      # always upload the sdist artifact- all the wheel build jobs require it

  make_linux_matrix:
    runs-on: ubuntu-24.04
    outputs:
      matrix_json: ${{ steps.make_matrix.outputs.matrix_json }}
    steps:
    - uses: actions/checkout@v7
    - name: make a matrix
      id: make_matrix
      uses: ./.github/actions/dynamatrix
      with:
        matrix_yaml: |
          include:
          # riscv64 manylinux
          - { spec: cp310-manylinux_riscv64, arch: riscv64, test_args: '{package}/src/c', omit: ${{ env.skip_slow_jobs }} }
          - { spec: cp311-manylinux_riscv64, arch: riscv64, test_args: '{package}/src/c', omit: ${{ env.skip_slow_jobs || env.skip_ci_redundant_jobs }} }
          - { spec: cp312-manylinux_riscv64, arch: riscv64, test_args: '{package}/src/c', omit: ${{ env.skip_slow_jobs || env.skip_ci_redundant_jobs }} }
          - { spec: cp313-manylinux_riscv64, arch: riscv64, test_args: '{package}/src/c', omit: ${{ env.skip_slow_jobs || env.skip_ci_redundant_jobs }} }
          - { spec: cp314-manylinux_riscv64, arch: riscv64, test_args: '{package}/src/c', omit: ${{ env.skip_slow_jobs || env.skip_ci_redundant_jobs }} }
          - { spec: cp314t-manylinux_riscv64, arch: riscv64, test_args: '{package}/src/c', omit: ${{ env.skip_slow_jobs || env.skip_ci_redundant_jobs }} }
          - { spec: cp315-manylinux_riscv64, arch: riscv64, test_args: '{package}/src/c', omit: ${{ env.skip_slow_jobs }} }
          - { spec: cp315t-manylinux_riscv64, arch: riscv64, test_args: '{package}/src/c', omit: ${{ env.skip_slow_jobs }} }

          # riscv64 musllinux
          - { spec: cp310-musllinux_riscv64, arch: riscv64, omit: ${{ env.skip_ci_redundant_jobs }} }
          - { spec: cp311-musllinux_riscv64, arch: riscv64, omit: ${{ env.skip_ci_redundant_jobs }} }
          - { spec: cp312-musllinux_riscv64, arch: riscv64, omit: ${{ env.skip_ci_redundant_jobs }} }
          - { spec: cp313-musllinux_riscv64, arch: riscv64, omit: ${{ env.skip_ci_redundant_jobs }} }
          - { spec: cp314-musllinux_riscv64, arch: riscv64, omit: ${{ env.skip_ci_redundant_jobs }} }
          - { spec: cp314t-musllinux_riscv64, arch: riscv64, omit: ${{ env.skip_ci_redundant_jobs }} }
          - { spec: cp315-musllinux_riscv64, arch: riscv64 }
          - { spec: cp315t-musllinux_riscv64, arch: riscv64 }

  linux:
    needs: [python_sdist, make_linux_matrix]
    runs-on: ${{ (matrix.arch == 'aarch64') && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.make_linux_matrix.outputs.matrix_json) }}

    steps:
    - name: fetch sdist artifact
      id: fetch_sdist
      uses: actions/download-artifact@v8
      with:
        name: ${{ needs.python_sdist.outputs.sdist_artifact_name }}

    - name: configure docker foreign arch support
      uses: docker/setup-qemu-action@v4.2.0
      if: matrix.arch != 'x86_64' && matrix.arch != 'i686' && matrix.arch != 'aarch64'

    - name: build/test wheels
      id: build
      env:
        CFLAGS: -Dffi_call=cffistatic_ffi_call  # override name for ffi_call to break hard if we linked against someone else's libffi
        CIBW_ARCHS_LINUX: all
        CIBW_BUILD: ${{ matrix.spec }}
        CIBW_ENABLE: cpython-prerelease
        CIBW_BEFORE_BUILD: |
          set -eux && \
          curl -L -O https://github.com/libffi/libffi/archive/v3.4.6.tar.gz && \
          tar zxf v3.4.6.tar.gz && cd libffi-3.4.6 && \
          ((command -v apk && apk add libtool) || true) && \
          ./autogen.sh && \
          ./configure --without-gcc-arch --disable-docs --with-pic --enable-shared=no && \
          make install && \
          cd .. && \
          rm -rf libffi-3.4.6
        CIBW_ENVIRONMENT_PASS_LINUX: CFLAGS  # ensure that the build container can see our overridden build config
        CIBW_MANYLINUX_X86_64_IMAGE: ${{ matrix.manylinux_img || 'manylinux2014' }}
        CIBW_MANYLINUX_I686_IMAGE: ${{ matrix.manylinux_img || 'manylinux2014' }}
        CIBW_MANYLINUX_AARCH64_IMAGE: ${{ matrix.manylinux_img || 'manylinux2014' }}
        CIBW_MANYLINUX_PPC64LE_IMAGE: ${{ matrix.manylinux_img || 'manylinux2014' }}
        CIBW_MANYLINUX_S390X_IMAGE: ${{ matrix.manylinux_img || 'manylinux2014' }}
        CIBW_MANYLINUX_RISCV64_IMAGE: ${{ matrix.manylinux_img || 'manylinux_2_39' }}
        CIBW_MUSLLINUX_X86_64_IMAGE: ${{ matrix.musllinux_img || 'musllinux_1_2' }}
        CIBW_MUSLLINUX_I686_IMAGE: ${{ matrix.musllinux_img || 'musllinux_1_2' }}
        CIBW_MUSLLINUX_AARCH64_IMAGE: ${{ matrix.musllinux_img || 'musllinux_1_2' }}
        CIBW_MUSLLINUX_RISCV64_IMAGE: ${{ matrix.musllinux_img || 'musllinux_1_2' }}
        CIBW_TEST_REQUIRES: pytest setuptools meson-python ninja # 3.12+ no longer includes distutils, just always ensure setuptools is present
        CIBW_TEST_COMMAND: PYTHONUNBUFFERED=1 python -m pytest ${{ matrix.test_args || '{project}' }}  # default to test all
      run: |
        set -eux

        mkdir cffi

        tar zxf ${{ steps.fetch_sdist.outputs.download-path }}/cffi*.tar.gz --strip-components=1 -C cffi
        python -m pip install --upgrade "${{ matrix.cibw_version || 'cibuildwheel' }}"

        # actually build libffi + wheel (using env tweaks above)
        python -m cibuildwheel --output-dir dist ./cffi

        echo "artifact_name=$(ls ./dist/)" >> "$GITHUB_OUTPUT"

    - name: upload artifacts
      uses: actions/upload-artifact@v7
      with:
        name: ${{ steps.build.outputs.artifact_name }}
        path: dist/*.whl
        if-no-files-found: error
      if: ${{ (matrix.skip_artifact_upload != 'true') && (env.skip_artifact_upload != 'true') }}

  merge_artifacts:
    needs: [python_sdist, linux]
    runs-on: ubuntu-24.04
    steps:
    - name: merge all artifacts
      uses: actions/upload-artifact/merge@v7
      with:
        name: dist-cffi-${{ needs.python_sdist.outputs.package_version }}
        delete-merged: true
      if: ${{ env.skip_artifact_upload != 'true' }}

  make_run_parallel_matrix:
    runs-on: ubuntu-24.04
    outputs:
      matrix_json: ${{ steps.make_matrix.outputs.matrix_json }}
    steps:
    - uses: actions/checkout@v7
    - name: make a matrix
      id: make_matrix
      uses: ./.github/actions/dynamatrix
      with:
        matrix_yaml: |
          include:
          - { runner: ubuntu-24.04, python-version: 3.15t-dev }

  pytest-run-parallel:
    needs: make_run_parallel_matrix
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.make_run_parallel_matrix.outputs.matrix_json) }}

    runs-on: ${{ matrix.runner }}
    steps:
    - name: clone repo
      uses: actions/checkout@v7

    - name: install python
      uses: actions/setup-python@v6
      with:
        python-version: ${{ matrix.python-version }}
        allow-prereleases: true

    - name: build and install
      run: |
        python -m pip install pytest setuptools meson-python ninja pytest-run-parallel
        python -m pip install .

    - name: run tests under pytest-run-parallel
      run: |
        python -m pytest --parallel-threads=4 --skip-thread-unsafe=True

  clang_TSAN:
    runs-on: ubuntu-24.04
    container: ghcr.io/nascheme/numpy-tsan:3.15t-dev
    steps:
    - uses: actions/checkout@v7

    - name: build and install
      run: |
        python -m pip install setuptools meson-python ninja pytest pytest-run-parallel
        CFLAGS="-g -O3 -fsanitize=thread" python -m pip install -v .

    - name: run tests under pytest-run-parallel
      run: |
        TSAN_OPTIONS="suppressions=$PWD/suppressions_free_threading.txt" \
        python -m pytest --parallel-threads=4 --skip-thread-unsafe=True -sv

  check:
    if: always()
    needs: [python_sdist, linux, clang_TSAN, pytest-run-parallel, merge_artifacts]
    runs-on: ubuntu-24.04
    steps:
    - name: Verify all previous jobs succeeded (provides a single check to sample for gating purposes)
      uses: re-actors/alls-green@release/v1
      with:
        jobs: ${{ toJSON(needs) }}
